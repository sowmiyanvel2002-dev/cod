<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alwin Josh — Film Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --dark: #0d0d0d;
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --muted: #6b6560;
    --card-bg: #161616;
    --border: rgba(201,168,76,0.25);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 5vw;
    background: rgba(13,13,13,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    color: var(--gold);
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--cream);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .nav-links a:hover { opacity: 1; color: var(--gold); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 8rem 5vw 5rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 70% 50%, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .hero-eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 6vw, 5.5rem);
    line-height: 1.05;
    margin-bottom: 1.5rem;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-desc {
    font-size: 1rem;
    color: rgba(245,240,232,0.65);
    max-width: 440px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 2rem;
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .hero-cta:hover {
    background: var(--gold);
    color: var(--dark);
  }

  .hero-visual {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 200px 200px;
    gap: 1rem;
  }

  .hero-card {
    background: var(--card-bg);
    border: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.25rem;
    overflow: hidden;
    position: relative;
  }

  .hero-card:first-child {
    grid-row: span 2;
    background: linear-gradient(180deg, #1a1510 0%, #0d0d0d 100%);
  }

  .hero-card-icon {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    opacity: 0.4;
  }

  .hero-card-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }

  .hero-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
  }

  .film-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px;
    background: #111;
    border-bottom: 0.5px solid var(--border);
  }

  .strip-hole {
    width: 14px;
    height: 22px;
    border: 1px solid #333;
    flex-shrink: 0;
  }

  /* SECTION COMMON */
  section {
    padding: 6rem 5vw;
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3.25rem);
    line-height: 1.15;
    margin-bottom: 1.5rem;
  }

  .section-title em { font-style: italic; color: var(--gold); }

  .small-cinematic-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream);
    margin: 1.5rem 0 1rem 0;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 3rem;
  }

  /* 2x2 CINEMATIC IMAGE MATRIX LAYOUT */
  .matrix-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    align-items: center;
    justify-content: center;
  }

  .matrix-item {
    text-align: center;
  }
